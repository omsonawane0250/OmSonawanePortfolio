<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="spotBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a120e"/>
      <stop offset="100%" stop-color="#050a08"/>
    </linearGradient>
    <linearGradient id="spotGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1db954"/>
      <stop offset="100%" stop-color="#1ed760"/>
    </linearGradient>
    <linearGradient id="albumGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="albumGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="spotShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#spotBg)"/>

  <!-- Ambient Green Glow -->
  <circle cx="150" cy="120" r="160" fill="#1db954" opacity="0.12" filter="blur(60px)"/>
  <circle cx="680" cy="380" r="150" fill="#3b82f6" opacity="0.08" filter="blur(60px)"/>

  <!-- Browser Shell -->
  <g filter="url(#spotShadow)">
    <rect x="40" y="35" width="720" height="430" rx="12" fill="#121212" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    
    <!-- Header -->
    <rect x="40" y="35" width="720" height="42" rx="12" fill="#181818"/>
    <circle cx="65" cy="56" r="5" fill="#ef4444"/>
    <circle cx="82" cy="56" r="5" fill="#f59e0b"/>
    <circle cx="99" cy="56" r="5" fill="#10b981"/>

    <!-- URL Bar -->
    <rect x="130" y="45" width="460" height="22" rx="6" fill="#000000" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="145" y="60" fill="#a7a7a7" font-family="'JetBrains Mono', monospace" font-size="11">spotify-clone.web/player</text>
    <rect x="630" y="47" width="100" height="18" rx="4" fill="rgba(29,185,84,0.15)"/>
    <text x="680" y="60" text-anchor="middle" fill="#1ed760" font-family="sans-serif" font-size="10" font-weight="600">FRONTEND</text>
  </g>

  <!-- Left Sidebar -->
  <rect x="52" y="88" width="155" height="295" rx="8" fill="#181818"/>
  <circle cx="78" cy="115" r="12" fill="#1ed760"/>
  <path d="M73 112 Q78 108 83 112 M72 116 Q78 112 84 116 M74 120 Q78 117 82 120" stroke="#000" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="98" y="120" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="13">Spotify</text>

  <rect x="62" y="140" width="135" height="28" rx="6" fill="#282828"/>
  <text x="75" y="158" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">🏠 Home</text>
  <text x="75" y="190" fill="#b3b3b3" font-family="sans-serif" font-size="11">🔍 Search</text>
  <text x="75" y="222" fill="#b3b3b3" font-family="sans-serif" font-size="11">📚 Your Library</text>
  
  <line x1="62" y1="245" x2="197" y2="245" stroke="#282828"/>
  <text x="75" y="270" fill="#b3b3b3" font-family="sans-serif" font-size="11">➕ Create Playlist</text>
  <text x="75" y="300" fill="#b3b3b3" font-family="sans-serif" font-size="11">💜 Liked Songs</text>
  <text x="75" y="330" fill="#b3b3b3" font-family="sans-serif" font-size="11">🎧 Podcasts</text>
  <text x="75" y="360" fill="#1ed760" font-family="sans-serif" font-size="10">● Coding Chill Vibes</text>

  <!-- Main Playlist Area -->
  <rect x="220" y="88" width="525" height="295" rx="8" fill="#181818"/>
  
  <!-- Banner Card -->
  <rect x="235" y="100" width="495" height="110" rx="8" fill="url(#albumGrad1)" opacity="0.85"/>
  <rect x="250" y="112" width="85" height="85" rx="6" fill="#121212" stroke="rgba(255,255,255,0.2)"/>
  <circle cx="292" cy="154" r="22" fill="url(#spotGreen)"/>
  <polygon points="288,144 302,154 288,164" fill="#000000"/>
  
  <text x="350" y="130" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="600">PLAYLIST</text>
  <text x="350" y="160" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="800">Developer Beats &amp; Lofi</text>
  <text x="350" y="182" fill="#e2e8f0" font-family="sans-serif" font-size="11">Om Sonawane • 24 songs, 1 hr 18 min</text>

  <!-- Songs Table Header -->
  <text x="245" y="235" fill="#a7a7a7" font-family="sans-serif" font-size="10">#</text>
  <text x="275" y="235" fill="#a7a7a7" font-family="sans-serif" font-size="10">TITLE</text>
  <text x="510" y="235" fill="#a7a7a7" font-family="sans-serif" font-size="10">ALBUM</text>
  <text x="690" y="235" fill="#a7a7a7" font-family="sans-serif" font-size="10">TIME</text>
  <line x1="240" y1="244" x2="730" y2="244" stroke="#282828"/>

  <!-- Row 1 (Playing) -->
  <rect x="238" y="250" width="490" height="34" rx="4" fill="#282828"/>
  <text x="245" y="271" fill="#1ed760" font-family="sans-serif" font-size="11">1</text>
  <text x="275" y="266" fill="#1ed760" font-family="sans-serif" font-size="11" font-weight="600">Midnight Syntax Pulse</text>
  <text x="275" y="278" fill="#a7a7a7" font-family="sans-serif" font-size="9">CodeFlow Records</text>
  <text x="510" y="271" fill="#a7a7a7" font-family="sans-serif" font-size="10">Dark Mode Vol. 1</text>
  <text x="690" y="271" fill="#1ed760" font-family="sans-serif" font-size="10">3:42</text>

  <!-- Row 2 -->
  <text x="245" y="306" fill="#a7a7a7" font-family="sans-serif" font-size="11">2</text>
  <text x="275" y="301" fill="#ffffff" font-family="sans-serif" font-size="11">Async Coffee Dreams</text>
  <text x="275" y="313" fill="#a7a7a7" font-family="sans-serif" font-size="9">Chill Dev Sessions</text>
  <text x="510" y="306" fill="#a7a7a7" font-family="sans-serif" font-size="10">Frontend Waves</text>
  <text x="690" y="306" fill="#a7a7a7" font-family="sans-serif" font-size="10">2:56</text>

  <!-- Row 3 -->
  <text x="245" y="342" fill="#a7a7a7" font-family="sans-serif" font-size="11">3</text>
  <text x="275" y="337" fill="#ffffff" font-family="sans-serif" font-size="11">Binary Echoes</text>
  <text x="275" y="349" fill="#a7a7a7" font-family="sans-serif" font-size="9">Silicon Valley Groove</text>
  <text x="510" y="342" fill="#a7a7a7" font-family="sans-serif" font-size="10">Neural Beats</text>
  <text x="690" y="342" fill="#a7a7a7" font-family="sans-serif" font-size="10">4:15</text>

  <!-- Bottom Audio Player Bar -->
  <rect x="40" y="390" width="720" height="75" rx="0" fill="#181818" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <!-- Current playing track left -->
  <rect x="55" y="405" width="45" height="45" rx="4" fill="url(#albumGrad1)"/>
  <text x="110" y="423" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">Midnight Syntax Pulse</text>
  <text x="110" y="439" fill="#a7a7a7" font-family="sans-serif" font-size="10">CodeFlow Records</text>
  <text x="240" y="432" font-size="13">💚</text>

  <!-- Center Player Controls -->
  <text x="350" y="425" fill="#a7a7a7" font-size="12">🔀</text>
  <text x="380" y="425" fill="#ffffff" font-size="14">⏮</text>
  <circle cx="415" cy="421" r="14" fill="#ffffff"/>
  <polygon points="412,415 422,421 412,427" fill="#000000"/>
  <text x="445" y="425" fill="#ffffff" font-size="14">⏭</text>
  <text x="475" y="425" fill="#a7a7a7" font-size="12">🔁</text>

  <!-- Progress bar -->
  <text x="300" y="448" fill="#a7a7a7" font-family="sans-serif" font-size="9">1:42</text>
  <rect x="330" y="443" fill="#4d4d4d" width="180" height="4" rx="2"/>
  <rect x="330" y="443" fill="#1ed760" width="75" height="4" rx="2"/>
  <circle cx="405" cy="445" r="4" fill="#ffffff"/>
  <text x="520" y="448" fill="#a7a7a7" font-family="sans-serif" font-size="9">3:42</text>

  <!-- Volume Right -->
  <text x="610" y="432" fill="#a7a7a7" font-size="13">🔊</text>
  <rect x="635" y="428" fill="#4d4d4d" width="90" height="4" rx="2"/>
  <rect x="635" y="428" fill="#1ed760" width="60" height="4" rx="2"/>
</svg>
